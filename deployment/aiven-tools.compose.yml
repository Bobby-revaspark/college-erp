# Optional Linux CLI runner for hosts whose native TLS stack rejects the project CA.
# .env.aiven is ignored by Git and is read only as runtime environment variables.
services:
  tools:
    image: campus-erp:aiven-tools
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env.aiven
    command: ["npm", "run", "db:check"]
